# npm への公開＝kairos-lang（2026-10-12 新設）: trusted publishing（OIDC）で CI から公開する。トークンは置かない
# （id-token: write で GitHub が npm に名乗る）・来歴（provenance）は npm が自動で付ける。発火はタグ v1.0.x の push
# （または tag を指定した手動実行）。job は environment「npm」の required reviewer が承認するまで始まらない＝
# 「確認してから世に出る」の型はそのまま。下限＝Node 22.14・npm 11.5.1（Node 24 同梱の npm は v24.5.0 以降 11.5.1 以上）。
# 公開ビルドはキャッシュを使わない（npm の手引きに同じ・毎回レジストリから入れる）。
# 2026-10-17 追加（1.0.11 から）: npm 公開の成功後に job windows-exe が Windows 単体 exe を組み、Release の資産に添付する（下の注記）。
name: Publish impl
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '公開するタグ（例: v1.0.10）'
        required: true
        type: string
      exe_only:
        description: 'npm 公開を飛ばして Windows exe だけ組む（タグの後に組む手順を直したとき。ref は main・impl のソースがタグと同一であることを照合して組む）'
        required: false
        type: boolean
        default: false
permissions:
  id-token: write   # OIDC（npm への名乗り）
  contents: read
concurrency:
  group: publish-impl
  cancel-in-progress: false   # 公開は途中で止めない・重なったら順番に
jobs:
  publish:
    if: ${{ !inputs.exe_only }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/kairos-lang
    timeout-minutes: 30
    defaults:
      run:
        working-directory: impl
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: 版の照合（タグ v1.0.x と package.json の version が一致）
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::タグの形が v1.0.x でない: $TAG"; exit 1; }
          VERSION="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$PKG" = "$VERSION" ] || { echo "::error::package.json は $PKG・タグは $TAG"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: npm が 11.5.1 以上であること（満たさなければ上げる）
        run: |
          node --version && npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||a===11&&(b>5||b===5&&c>=1)?0:1)" "$(npm --version)" || npm i -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run --testTimeout=90000
      - name: 配布物の中身（prepack→build を含む）
        run: npm pack --dry-run
      - run: npm publish
      - name: 公開後の実測（版・shasum・来歴）
        run: |
          set -euo pipefail
          # staged publishing: publish 直後は数分レジストリに見えないことがある（1.0.9 の mcp で 4 分）。30 秒おきに最長 10 分待つ。
          for i in $(seq 1 20); do
            seen="$(npm view "kairos-lang@${VERSION}" version 2>/dev/null || true)"
            if [ "$seen" = "$VERSION" ]; then
              npm view "kairos-lang@${VERSION}" version dist.shasum dist.attestations
              { echo "## kairos-lang@${VERSION}"; echo '```'; npm view "kairos-lang@${VERSION}" dist.shasum dist.attestations; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::kairos-lang@${VERSION} がレジストリにまだ見えない。手元で npm view kairos-lang@${VERSION} dist.attestations を確かめる"

  # Windows 単体 exe（2026-10-17 新設・1.0.11 から）: npm 公開の成功後に windows-latest で SEA を組み、Release v1.0.x の資産に添付する。
  # 台＝nodejs.org の node.exe（ランナーの Node と同じ版・SHASUMS256.txt で照合）→ 注入の前に Authenticode 署名を剥がす
  # （impl/scripts/strip-authenticode.mjs・注入後は剥がせない）→ impl/scripts/build-sea.mjs --win（Windows 上なので実走検証＝参照実装と
  # 出力バイト一致まで走る）→ zip（exe＋README 日英）＋ .sha256 → gh release upload。1.0.10 で手作業だった手順（runbook v1.0.10 ④）の機械化。
  # Release はタグの後・承認の前に人が作る（runbook §3）。無ければこの job は失敗する＝Release を作ってから gh run rerun --failed。
  # やり直し（2026-10-19 追加）: タグの後に組む手順（scripts・この job）を直したときは、workflow_dispatch で ref=main・tag=v1.0.x・exe_only=true
  # ＝npm 公開を飛ばし、impl のソース（src・stdlib・package.json・lock）がタグと同一であることを git diff で照合してから組む＝配布物は常にタグのソースから。
  windows-exe:
    needs: publish
    if: ${{ always() && (needs.publish.result == 'success' || inputs.exe_only) }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write   # Release の資産を添付する（この job だけ）
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.exe_only && github.ref || (github.event_name == 'workflow_dispatch' && inputs.tag || github.ref) }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 版の照合（タグ＝package.json）・impl のソースがタグと同一・Release の存在
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::タグの形が v1.0.x でない: $TAG"; exit 1; }
          VERSION="${TAG#v}"
          PKG="$(node -p "require('./impl/package.json').version")"
          [ "$PKG" = "$VERSION" ] || { echo "::error::package.json は $PKG・タグは $TAG"; exit 1; }
          git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          if ! git diff --quiet "refs/tags/$TAG" -- impl/src impl/stdlib impl/package.json impl/package-lock.json; then
            echo "::error::impl のソースがタグ $TAG と異なる（配布物はタグのソースから組む）"
            git diff --stat "refs/tags/$TAG" -- impl/src impl/stdlib impl/package.json impl/package-lock.json
            exit 1
          fi
          gh release view "$TAG" --json tagName --jq .tagName >/dev/null || { echo "::error::Release $TAG が無い。Release を作ってから gh run rerun --failed"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NODE_V=$(node --version)" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: impl
      - name: 台の node.exe（nodejs.org・ランナーと同じ版・SHASUMS256.txt で照合）→ 署名を剥がす
        run: |
          set -euo pipefail
          mkdir -p base
          curl -fsSL -o "base/node-$NODE_V-win-x64.zip" "https://nodejs.org/dist/$NODE_V/node-$NODE_V-win-x64.zip"
          curl -fsSL -o base/SHASUMS256.txt "https://nodejs.org/dist/$NODE_V/SHASUMS256.txt"
          (cd base && grep " node-$NODE_V-win-x64.zip\$" SHASUMS256.txt | sha256sum -c -)
          pwsh -NoProfile -Command "Expand-Archive -LiteralPath 'base/node-$NODE_V-win-x64.zip' -DestinationPath 'base/unz'"
          cp "base/unz/node-$NODE_V-win-x64/node.exe" base/node.exe
          node impl/scripts/strip-authenticode.mjs base/node.exe base/node-unsigned.exe
      - name: SEA を組む（Windows 上＝参照実装と出力バイト一致の実走検証つき・検証の tz は固定）
        run: node impl/scripts/build-sea.mjs --win base/node-unsigned.exe
      - name: zip（exe＋README 日英）と sha256
        run: |
          set -euo pipefail
          ZIP="kairos-$VERSION-win-x64.zip"
          sed "s/{{VERSION}}/$VERSION/g; s/{{NODE}}/$NODE_V/g" impl/scripts/README-windows.template.txt > dist/README-windows.txt
          pwsh -NoProfile -Command "Compress-Archive -LiteralPath 'dist/kairos.exe','dist/README-windows.txt' -DestinationPath 'dist/$ZIP'"
          (cd dist && sha256sum "$ZIP" > "$ZIP.sha256" && cat "$ZIP.sha256" && sha256sum kairos.exe)
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
      - name: Release の資産に添付
        run: |
          set -euo pipefail
          gh release upload "$TAG" "dist/$ZIP" "dist/$ZIP.sha256" --clobber
          { echo "## Windows 単体 exe（$TAG）"; echo '```'; cat "dist/$ZIP.sha256"; echo "node.exe: $NODE_V（nodejs.org・署名を剥がして注入）"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
