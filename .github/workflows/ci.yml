# CI マトリクス: 「Windows でも動く」を主張でなく機械検査にする（2026-08-06 新設）。
# テストは Linux/Windows の 2 レーンで全数実行（doctest・文書整合検査・Playground 同期
# ゲート込み）。単一バイナリ配布（Node SEA）に先行する移植性の網。
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: impl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: impl/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # testTimeout はローカル 30s（vitest.config）。CI ランナーは速度の揺らぎが大きく、
      # タイムアウトは「遅い」でなく「壊れた」の検出に使う方針（同 config の注記）のため
      # CI では 90s に緩める——高負荷時の偽陽性タイムアウト（2026-08-03 実測）と同型の対策。
      - run: npx vitest run --testTimeout=90000

  # npm 配布物の実装検査（2026-09-07 新設・Show HN 前提①「npm の慣らし」の前倒し）: prepack→dist・bin・files・engines を
  # 「pack した tarball を別ディレクトリへ install して CLI を実走」で 3 OS × Node 20（engines の下限）で確かめる。
  # publish 前から publish 後と同じ経路を機械検査にする——当日の「npm install が失敗する」を先に潰す。
  pack-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: impl/package-lock.json
      - run: npm ci
        working-directory: impl
      - run: npm pack --pack-destination "${{ runner.temp }}"
        working-directory: impl
      - name: install the tarball into a clean directory and run the CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/inst" && cd "${{ runner.temp }}/inst"
          npm init -y >/dev/null
          npm i --no-audit --no-fund "${{ runner.temp }}"/kairos-*.tgz
          ./node_modules/.bin/kairos --version
          ./node_modules/.bin/kairos next -n 3 --json "${GITHUB_WORKSPACE}/impl/examples/payday.kairos" > out.json
          node -e "const r=require('./out.json'); if(r.found!==3||r.results[0].points.length!==3){console.error(JSON.stringify(r).slice(0,300));process.exit(1)}; console.log('ok', r.version, r.results[0].dates.join(' '))"
