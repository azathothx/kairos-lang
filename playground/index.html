<h1>Kairos Playground</h1>

<p>ブラウザの中で Kairos 式を評価する（リファレンス実装をそのまま実行・サーバー送信なし）。
言語は RC（リリース候補）段階——仕様は <a href="../spec/">言語仕様</a>・語彙は
<a href="../reference/">記述語リファレンス</a>・学習は
<a href="https://github.com/azathothx/kairos-lang-exam">教本とサンプル問題</a>。</p>

<div id="kairos-playground">
  <div style="margin-bottom:8px">
    <label>例:
      <select id="pg-example" style="max-width:100%">
        <option value="">——選ぶ——</option>
        <option value="payday">給料日（毎月 25 日・休日なら前営業日）</option>
        <option value="monthend3">月末の 3 営業日前</option>
        <option value="cascade">振替休日・国民の休日の導出</option>
        <option value="friday13">13 日の金曜日（積）</option>
        <option value="empty">空テーブルと被覆サマリ（運用信号）</option>
      </select>
    </label>
  </div>
  <textarea id="pg-src" rows="14" spellcheck="false"
    style="width:100%;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;box-sizing:border-box"></textarea>
  <div style="margin:8px 0;display:flex;gap:12px;flex-wrap:wrap;align-items:center">
    <label>from <input id="pg-from" type="date" value="2026-01-01"></label>
    <label>to <input id="pg-to" type="date" value="2027-01-01"></label>
    <label>tz <input id="pg-tz" type="text" value="Asia/Tokyo" size="14"></label>
    <button id="pg-run" type="button" style="padding:4px 20px;font-weight:bold">評価（Ctrl+Enter）</button>
    <button id="pg-share" type="button" style="padding:4px 12px">URL に固定</button>
  </div>
  <pre id="pg-out" style="min-height:8em;background:#f6f8fa;border:1px solid #d0d7de;border-radius:6px;padding:12px;overflow-x:auto;white-space:pre">ここに結果が出る。</pre>
</div>

<p style="font-size:0.85em;color:#57606a">評価範囲は <code>[from, to)</code> の右開区間。出力の
<code># ⚠</code> は範囲外出自の註釈・<code># 被覆サマリ</code> はデータの残走路
（<a href="../spec/30-body-layer.html">仕様 §4.10</a>）。「URL に固定」で式込みのリンクを共有できる。</p>

<script type="module" src="app.js"></script>
