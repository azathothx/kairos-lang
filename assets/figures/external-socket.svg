  <rect width="1200" height="704" fill="#FBFAF8" class="bg"/>
  <text x="60" y="56" font-size="26" class="ink" font-weight="700">Expressions are static, data arrives at run time — the external socket</text>
  <rect x="60" y="96" width="400" height="360" rx="16" class="panel"/>
  <text x="90" y="136" font-size="22" class="ink" font-weight="700">Expression — static</text>
  <text x="90" y="162" font-size="12" class="sub">The definition file. Reviewed. It does not know which days are holidays</text>
  <rect x="90" y="180" width="340" height="176" rx="12" class="card"/>
  <text x="110" y="208" font-size="14" class="mono ink">premise HRDB {</text>
  <text x="126.8" y="234" font-size="14" class="mono ink">calendar-system: Gregorian</text>
  <text x="126.8" y="260" font-size="14" class="mono ink">tz: "Asia/Tokyo"</text>
  <text x="126.8" y="286" font-size="14" class="mono ink">source: "hr-db/holidays"</text>
  <text x="126.8" y="312" font-size="14" class="mono gold" font-weight="700">holidays = external(kind: dates)</text>
  <text x="110" y="338" font-size="14" class="mono ink">}</text>
  <text x="90" y="390" font-size="13" class="sub">The expression knows only kind (the alignment claim) and</text>
  <text x="90" y="414" font-size="13" class="sub">source (provenance): "a sequence of dates arrives here".</text>
  <rect x="452" y="236" width="22" height="72" rx="3" class="ink"/>
  <text x="600" y="214" font-size="17" class="ink" text-anchor="middle" font-weight="700">socket</text>
  <line x1="716" y1="272" x2="500" y2="272" class="arrow"/><polygon points="484,272 504,261 504,283" class="arrowhead"/>
  <text x="600" y="298" font-size="11" class="sub" text-anchor="middle">resolved once, at the first reference</text>
  <text x="600" y="315" font-size="11" class="sub" text-anchor="middle">in an evaluation; pinned thereafter</text>
  <rect x="486" y="330" width="228" height="110" rx="10" class="b"/>
  <text x="600" y="355" font-size="13" class="ink" text-anchor="middle" font-weight="700">Contract (always carried)</text>
  <text x="600" y="380" font-size="12.5" class="ink" text-anchor="middle">covering = range claimed complete</text>
  <text x="600" y="401" font-size="12.5" class="ink" text-anchor="middle">asof = time of knowledge</text>
  <text x="600" y="426" font-size="12" class="red" text-anchor="middle" font-weight="700">either missing = contract violation</text>
  <rect x="720" y="96" width="420" height="360" rx="16" class="panel"/>
  <text x="750" y="136" font-size="22" class="ink" font-weight="700">Data — run time</text>
  <text x="750" y="162" font-size="12" class="sub">DB, file, HTTP. How to fetch is outside the language (ADR-15)</text>
  <rect x="750" y="180" width="360" height="124" rx="12" class="card"/>
  <text x="770" y="208" font-size="14" class="ink">resolved value (a table value itself)</text>
  <text x="770" y="234" font-size="14" class="mono ink">dates: [2026-01-01, 2026-01-12]</text>
  <text x="770" y="260" font-size="14" class="mono gold" font-weight="700">covering: 2026-01-01..2026-01-31</text>
  <text x="770" y="286" font-size="14" class="mono gold" font-weight="700">asof: 2026-01-15</text>
  <text x="750" y="338" font-size="13" class="sub">Only the supply side updates. The expression does not change.</text>
  <text x="750" y="362" font-size="13" class="sub">"Nothing yet" = dates: [] plus covering: a legitimate value.</text>
  <text x="60" y="492" font-size="16" class="ink" font-weight="700">The checks are written on the socket — the same governance checks as a literal, imposed as a contract</text>
  <rect x="60" y="508" width="340" height="92" rx="10" class="card"/>
  <text x="78" y="536" font-size="14" class="ink" font-weight="700">A point outside covering</text>
  <text x="78" y="560" font-size="11.5" class="red" font-weight="700">contract violation: stop (containment in the coverage)</text>
  <text x="78" y="584" font-size="10.5" class="sub">ascending order and labels (domain, same length) are checked too</text>
  <rect x="430" y="508" width="340" height="92" rx="10" class="card"/>
  <text x="448" y="536" font-size="14" class="ink" font-weight="700">A date that does not exist</text>
  <text x="448" y="560" font-size="11.5" class="red" font-weight="700">contract violation: stop (2026-02-30)</text>
  <text x="448" y="584" font-size="10.5" class="sub">no silent rollover (ADR-43)</text>
  <rect x="800" y="508" width="340" height="92" rx="10" class="card"/>
  <text x="818" y="536" font-size="14" class="ink" font-weight="700">No supply arrives</text>
  <text x="818" y="560" font-size="11.5" class="red" font-weight="700">supply error: stop (a machine-readable subclass)</text>
  <text x="818" y="584" font-size="10.5" class="sub">never silently "no holidays"; distinct from the empty value by type</text>
  <text x="60" y="634" font-size="12.5" class="sub">The out-of-coverage annotation and the coverage summary ride along with the answer (evaluating 2026-01-01..2026-03-01; from February on, firing continues, annotated):</text>
  <text x="60" y="658" font-size="13" class="mono red">⚠ 範囲外 2026-02-01..2026-03-01（HRDB.holidays covering 2026-01-01..2026-01-31, asof 2026-01-15）</text>
  <text x="60" y="680" font-size="13" class="mono gold">coverage summary: HRDB.holidays covering 2026-01-01..2026-01-31 asof 2026-01-15 runway -28 days</text>
