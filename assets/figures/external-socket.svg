<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 704" role="img" aria-labelledby="fig-external-socket-en">
  <title id="fig-external-socket-en">The external socket. Left: the expression (static) — premise HRDB only declares holidays = external(kind: dates). Right: the data arriving at run time (the resolved value), carrying dates, covering 2026-01-01..2026-01-31 and asof 2026-01-15. The socket in the middle states the contract (covering and asof are always carried); the three cards below are the checks (a point outside covering or a non-existent date is a contract violation; no supply is a supply error). The last line shows the out-of-coverage annotation and the coverage summary (runway -28 days) that ride along with the answer.</title>
