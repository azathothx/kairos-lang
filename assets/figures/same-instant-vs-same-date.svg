  <title id="fig-same-instant-vs-same-date-en">Tokyo's and New York's civil days placed on one physical time axis. Tokyo's 2/12 and NY's 2/12 are separate intervals 14 hours apart. Tokyo's 2/12 0:00 is still 2/11 10:00 in NY, so mapping by the same instant (snapTo) lands on 2/11; mapping by the same date (rebase) maps 2/12 to 2/12.</title>
