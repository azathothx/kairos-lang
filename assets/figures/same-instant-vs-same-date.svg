  <text x="610" y="396" font-size="13" class="gold" font-weight="700">Same date = rebase: Tokyo's 2/12 → NY's 2/12 (by label, ignoring the 14 h offset)</text>
  <text x="60" y="436" font-size="13" class="sub">Intersection &amp; compares points. A naive Tok.biz &amp; NYk.biz compares the first instant of Tokyo's 2/12 with NY's; they differ, so the answer would silently be empty.</text>
  <text x="60" y="462" font-size="13" class="sub">The language stops this form with a static error and makes the writer choose snapTo (same instant) or rebase (same date) (alignment, §4.5; ADR-36/40).</text>
