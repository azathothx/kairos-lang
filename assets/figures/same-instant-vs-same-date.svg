  <text x="60" y="56" font-size="24" class="ink" font-weight="700">Tokyo's Feb 12 and New York's Feb 12 are not the same interval — same instant vs same date</text>
  <text x="60" y="92" font-size="15" class="sub">Both civil days on one physical time axis. Tokyo (JST) and New York (EST) are separate intervals, 14 hours apart</text>
