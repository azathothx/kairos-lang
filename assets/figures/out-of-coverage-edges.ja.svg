  <title id="fig-out-of-coverage-edges-ja">2026 年の祝日表（covering 2026-01-01..2026-12-31）を評価範囲 2026 年いっぱいで使ったときの範囲外註釈を、年の両端を拡大した数直線で示す。窓頭領域: 25 日払いを roll(Preceding) すると 1/1 の前の営業日は表の外なので「⚠ 範囲外 2026-01-01..2026-01-02」。窓尾領域: 30 日払いを roll(Following) すると 12/31 の次の営業日は表の外なので「⚠ 範囲外 2026-12-31..2027-01-01」。点列は 12 点とも確定し、註釈だけが併走する。</title>
