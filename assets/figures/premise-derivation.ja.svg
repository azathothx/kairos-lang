  <rect width="1200" height="682" fill="#FBFAF8" class="bg"/>
  <text x="60" y="56" font-size="28" class="ink" font-weight="700">with は指定した公開語だけ差し替え、残りを継承する——会計暦の派生</text>
  <text x="60" y="90" font-size="15" class="sub">premise Fiscal = Gregorian with { year = … }。year 一語の上書きで、year に依存する quarter・yearStart は再解決で追従し、month・day は不動</text>
  <rect x="60" y="120" width="380" height="460" rx="16" class="panel"/>
  <text x="80" y="156" font-size="19" class="ink" font-weight="700">基底 premise: Gregorian</text>
  <text x="80" y="180" font-size="13" class="sub">原始的定義——公開語と前文メンバーを持つ</text>
  <rect x="80" y="196" width="340" height="244" rx="10" class="card"/>
  <text x="96" y="216" font-size="14" class="ink" font-weight="700">公開語</text>
  <text x="96" y="244" font-size="13" class="mono ink">day</text>
  <text x="196" y="244" font-size="12" class="mono sub">chronos grid 1d</text>
  <text x="96" y="267" font-size="13" class="mono ink">weekday</text>
  <text x="196" y="267" font-size="12" class="mono sub">day cycle [Mon, …, Sun]</text>
  <text x="96" y="290" font-size="13" class="mono ink">month</text>
  <text x="196" y="290" font-size="12" class="mono sub">day span daysInMonth</text>
  <rect x="88" y="297" width="324" height="22" rx="4" class="win"/>
  <text x="96" y="313" font-size="13" class="mono ink" font-weight="700">year</text>
  <text x="196" y="313" font-size="12" class="mono sub">month span (_ =&gt; 12) phase: 0</text>
  <text x="96" y="336" font-size="13" class="mono ink" font-weight="700">quarter</text>
  <text x="196" y="336" font-size="12" class="mono sub">year split [3,3,3,3] by: month</text>
  <text x="96" y="359" font-size="13" class="mono ink">week</text>
  <text x="196" y="359" font-size="12" class="mono sub">segmentBy(weekStart)</text>
  <text x="96" y="382" font-size="13" class="mono ink">monthStart</text>
  <text x="196" y="382" font-size="12" class="mono sub">month |&gt; first</text>
  <text x="96" y="405" font-size="13" class="mono ink">monthEnd</text>
  <text x="196" y="405" font-size="12" class="mono sub">month |&gt; last</text>
  <text x="96" y="428" font-size="13" class="mono ink" font-weight="700">yearStart</text>
  <text x="196" y="428" font-size="12" class="mono sub">year |&gt; first</text>
  <rect x="80" y="452" width="340" height="100" rx="10" class="card"/>
  <text x="96" y="472" font-size="14" class="ink" font-weight="700">前文メンバー（10 語）</text>
  <text x="96" y="494" font-size="12" class="mono ink">calendar-system:  calendar:  axis:</text>
  <text x="96" y="514" font-size="12" class="mono ink">roll:  granularity:  tz:  wkst:</text>
  <text x="96" y="534" font-size="12" class="mono ink">asof:  source:  epoch:</text>
  <text x="80" y="570" font-size="12" class="sub">基底の宣言（未宣言は利用側の在圏で解決）</text>
  <rect x="760" y="120" width="380" height="460" rx="16" class="panel"/>
  <text x="780" y="156" font-size="19" class="ink" font-weight="700">派生 premise: Fiscal</text>
  <text x="780" y="180" font-size="13" class="sub">上書きは year だけ。残りは基底から継承</text>
  <rect x="780" y="196" width="340" height="244" rx="10" class="card"/>
  <text x="796" y="216" font-size="14" class="ink" font-weight="700">公開語</text>
  <text x="796" y="244" font-size="13" class="mono ink">day</text>
  <text x="896" y="244" font-size="12" class="sub">継承（不動）</text>
  <text x="796" y="267" font-size="13" class="mono ink">weekday</text>
  <text x="896" y="267" font-size="12" class="sub">継承（不動）</text>
  <text x="796" y="290" font-size="13" class="mono ink">month</text>
  <text x="896" y="290" font-size="12" class="sub">継承（不動）</text>
  <rect x="788" y="297" width="324" height="22" rx="4" class="a"/>
  <text x="796" y="313" font-size="13" class="mono wt" font-weight="700">year</text>
  <text x="896" y="313" font-size="12" class="wt" font-weight="700">上書き（phase: 3＝4 月始まり）</text>
  <rect x="788" y="320" width="324" height="22" rx="4" class="b"/>
  <text x="796" y="336" font-size="13" class="mono ink" font-weight="700">quarter</text>
  <text x="896" y="336" font-size="12" class="ink" font-weight="700">再解決 → 会計四半期に追従</text>
  <text x="796" y="359" font-size="13" class="mono ink">week</text>
  <text x="896" y="359" font-size="12" class="sub">継承（不動）</text>
  <text x="796" y="382" font-size="13" class="mono ink">monthStart</text>
  <text x="896" y="382" font-size="12" class="sub">継承（不動）</text>
  <text x="796" y="405" font-size="13" class="mono ink">monthEnd</text>
  <text x="896" y="405" font-size="12" class="sub">継承（不動）</text>
  <rect x="788" y="412" width="324" height="22" rx="4" class="b"/>
  <text x="796" y="428" font-size="13" class="mono ink" font-weight="700">yearStart</text>
  <text x="896" y="428" font-size="12" class="ink" font-weight="700">再解決 → 4 月 1 日に追従</text>
  <rect x="780" y="452" width="340" height="100" rx="10" class="card"/>
  <text x="796" y="472" font-size="14" class="ink" font-weight="700">前文メンバー（10 語）</text>
  <text x="796" y="494" font-size="12" class="mono sub">calendar-system:  calendar:  axis:</text>
  <text x="796" y="514" font-size="12" class="mono sub">roll:  granularity:  tz:  wkst:</text>
  <text x="796" y="534" font-size="12" class="mono sub">asof:  source:  epoch:</text>
  <text x="780" y="570" font-size="12" class="sub">基底連鎖から継承。ブロックに宣言した語だけ上書き</text>
  <text x="600" y="178" font-size="16" class="gold" text-anchor="middle" font-weight="700">派生（with）</text>
  <line x1="444" y1="198" x2="744" y2="198" class="arrow"/><polygon points="756,198 742,191 742,205" class="arrowhead"/>
  <rect x="460" y="216" width="280" height="132" rx="10" class="card"/>
  <text x="474" y="242" font-size="12" class="mono ink">premise Fiscal = Gregorian with {</text>
  <text x="488.4" y="264" font-size="12" class="mono gold" font-weight="700">year = month span (_ =&gt; 12)</text>
  <text x="502.8" y="286" font-size="12" class="mono ink">phase: 3</text>
  <text x="502.8" y="308" font-size="12" class="mono ink">label: (p =&gt; yearNo(p))</text>
  <text x="474" y="330" font-size="12" class="mono ink">}</text>
  <text x="600" y="374" font-size="13" class="ink" text-anchor="middle" font-weight="700">差し替えるのは year 一語</text>
  <text x="600" y="396" font-size="12" class="sub" text-anchor="middle">month に触れない → 暦日・月末は不動（I1）</text>
  <text x="600" y="416" font-size="12" class="sub" text-anchor="middle">quarter・yearStart は裸名の再解決で追従</text>
  <text x="600" y="456" font-size="12" class="sub" text-anchor="middle">日常形（糖衣）:</text>
  <text x="600" y="476" font-size="11.5" class="mono gold" text-anchor="middle">Gregorian |&gt;</text>
  <text x="600" y="494" font-size="11.5" class="mono gold" text-anchor="middle">rephase(+3, on: year, unit: month)</text>
  <text x="60" y="612" font-size="13.5" class="sub">指定した公開語だけ差し替え、残りは継承する。裸名は派生スコープで再解決される（機構 A・ADR-17）ので、year に依存する quarter・yearStart は自動で追従する。</text>
  <text x="60" y="634" font-size="13.5" class="sub">Base.word と書けば基底の値にピンできる。前文メンバー 10 語も基底連鎖から継承し、ブロックに宣言した語だけが上書きされる（ADR-35 改訂 3）。</text>
  <text x="60" y="656" font-size="13.5" class="sub">日付は動かない（I1）——派生が動かすのは窓の切れ目だけ。2026-03-01 は「3 月 1 日」のまま、所属する年窓だけが 2025 年度（Apr2025–Mar2026）になる。</text>
</svg>
