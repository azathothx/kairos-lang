  <title id="fig-premise-derivation-ja">基底 premise Gregorian から with で派生 premise Fiscal を作る図。左の箱は Gregorian の公開語（day・month・year・quarter…）と前文メンバー 10 語。中央の with ブロックで year だけを 4 月始まりに上書きすると、右の箱では year が差し替わり、year に依存する quarter と yearStart は再解決で追従し、残りの公開語と前文メンバーは基底から継承される。</title>
