  <title id="fig-half-open-intervals-ja">半開区間の図。上: 8 時から 16 時の数直線に営業セッション [9:00, 15:00) を置く。9:00 は含み（●）、15:00 は含まない（○）。2026-01-05 の hourly |&gt; filter(t =&gt; isOpen(t)) は 09:00 から 14:00 の 6 点で、15:00 は出ない。下: 「9:00〜11:59」「12:00〜17:59」「18:00〜23:59」の両閉じは継ぎ目ごとに 59 秒の隙間を生むが、半開 [9:00, 12:00) [12:00, 18:00) [18:00, 24:00) は継ぎ目が同じ点で重ならず漏れない。マーカー 9:00・12:00・18:00・24:00（2026-01-06T00:00）の segmentBy は各窓の first が 09:00・12:00・18:00、last が 11:00・17:00・23:00。</title>
