  <rect x="781.04" y="528" width="3" height="32" class="a"/>
  <text x="60" y="608" font-size="13" class="sub">The top three rows are partition windows (they divide the axis completely). Bundling with within(name) lets selectors (first/nth/last) pick relative to the window.</text>
  <text x="60" y="630" font-size="13" class="sub">Only segmentBy makes interval windows: a sequence of points gives the boundaries and coverage is not guaranteed. Omitting edges:/empties: is a static error.</text>
