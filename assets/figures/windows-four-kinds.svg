<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 656" role="img" aria-labelledby="fig-windows-four-kinds-en">
  <title id="fig-windows-four-kinds-en">The four ways to make windows, drawn over the same nine-week strip of days. within(month) divides the axis by month. split divides the parent week into dependent windows of widths [5, 2]. span bundles days five at a time (from the epoch, so starting 1/2). segmentBy cuts intervals at new-moon markers, with no window before the first marker. The dots in each row are the first of each window.</title>
