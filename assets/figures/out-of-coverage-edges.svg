  <text x="60" y="424" font-size="13" class="sub">All 12 points come out settled. The annotation is not part of the value; it runs alongside and says only "this interval may depend on what lies outside the table" (ADR-37, I6).</text>
  <text x="60" y="446" font-size="13" class="sub">Nothing is silently returned as 2025-12-31 and nothing is silently dropped. If unwanted, extend covering to the previous year end and next year start and it disappears.</text>
