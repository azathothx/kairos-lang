  <title id="fig-out-of-coverage-edges-en">Out-of-coverage annotations when a 2026 holiday table (covering 2026-01-01..2026-12-31) is evaluated over the whole of 2026, drawn on a number line with both ends of the year enlarged. Head region: rolling the 25th payday with Preceding, the business day before 1/1 lies outside the table, so "⚠ out-of-coverage 2026-01-01..2026-01-02". Tail region: rolling the 30th payday with Following, the business day after 12/31 lies outside, so "⚠ out-of-coverage 2026-12-31..2027-01-01". All 12 points are settled; only the annotation runs alongside.</title>
