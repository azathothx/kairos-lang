  <rect width="1200" height="704" fill="#FBFAF8" class="bg"/>
  <text x="60" y="56" font-size="30" class="ink" font-weight="700">式は静的、データは実行時——external の差し込み口</text>
  <rect x="60" y="96" width="400" height="360" rx="16" class="panel"/>
  <text x="90" y="136" font-size="22" class="ink" font-weight="700">式——静的</text>
  <text x="90" y="162" font-size="13" class="sub">定義ファイル。レビューの対象。祝日が何日かは知らない</text>
  <rect x="90" y="180" width="340" height="176" rx="12" class="card"/>
  <text x="110" y="208" font-size="14" class="mono ink">premise HRDB {</text>
  <text x="126.8" y="234" font-size="14" class="mono ink">calendar-system: Gregorian</text>
  <text x="126.8" y="260" font-size="14" class="mono ink">tz: "Asia/Tokyo"</text>
  <text x="126.8" y="286" font-size="14" class="mono ink">source: "hr-db/holidays"</text>
  <text x="126.8" y="312" font-size="14" class="mono gold" font-weight="700">holidays = external(kind: dates)</text>
  <text x="110" y="338" font-size="14" class="mono ink">}</text>
  <text x="90" y="390" font-size="14" class="sub">式が知るのは kind（整列の主張）と source（出所）、</text>
  <text x="90" y="414" font-size="14" class="sub">つまり「ここに日付の列が来る」ことだけ。</text>
  <rect x="452" y="236" width="22" height="72" rx="3" class="ink"/>
  <text x="600" y="214" font-size="17" class="ink" text-anchor="middle" font-weight="700">差し込み口（socket）</text>
  <line x1="716" y1="272" x2="500" y2="272" class="arrow"/><polygon points="484,272 504,261 504,283" class="arrowhead"/>
  <text x="600" y="298" font-size="12" class="sub" text-anchor="middle">評価の初回参照時に一回だけ解決</text>
  <text x="600" y="315" font-size="12" class="sub" text-anchor="middle">以後はそのスナップショットに固定</text>
  <rect x="486" y="330" width="228" height="110" rx="10" class="b"/>
  <text x="600" y="355" font-size="14" class="ink" text-anchor="middle" font-weight="700">契約（解決値が必ず運ぶ）</text>
  <text x="600" y="380" font-size="13" class="ink" text-anchor="middle">covering＝完全性を主張する範囲</text>
  <text x="600" y="401" font-size="13" class="ink" text-anchor="middle">asof＝知識の時点</text>
  <text x="600" y="426" font-size="12" class="red" text-anchor="middle" font-weight="700">どちらも欠落＝契約違反</text>
  <rect x="720" y="96" width="420" height="360" rx="16" class="panel"/>
  <text x="750" y="136" font-size="22" class="ink" font-weight="700">データ——実行時</text>
  <text x="750" y="162" font-size="13" class="sub">DB・ファイル・HTTP。取り方は言語の外（ADR-15）</text>
  <rect x="750" y="180" width="360" height="124" rx="12" class="card"/>
  <text x="770" y="208" font-size="14" class="ink">解決値（テーブル値そのもの）</text>
  <text x="770" y="234" font-size="14" class="mono ink">dates: [2026-01-01, 2026-01-12]</text>
  <text x="770" y="260" font-size="14" class="mono gold" font-weight="700">covering: 2026-01-01..2026-01-31</text>
  <text x="770" y="286" font-size="14" class="mono gold" font-weight="700">asof: 2026-01-15</text>
  <text x="750" y="338" font-size="14" class="sub">更新は供給側だけ。式は 1 文字も変わらない。</text>
  <text x="750" y="362" font-size="14" class="sub">「まだ何も無い」は dates: []＋covering＝正当な値。</text>
  <text x="60" y="492" font-size="18" class="ink" font-weight="700">検査は口に書いてある——リテラルと同一の統治検査が契約として掛かる</text>
  <rect x="60" y="508" width="340" height="92" rx="10" class="card"/>
  <text x="78" y="536" font-size="15" class="ink" font-weight="700">covering の外の点が混ざる</text>
  <text x="78" y="560" font-size="13" class="red" font-weight="700">契約違反で止める（覆域の包含）</text>
  <text x="78" y="584" font-size="12" class="sub">昇順・labels の値域と同長も同じ器で検査</text>
  <rect x="430" y="508" width="340" height="92" rx="10" class="card"/>
  <text x="448" y="536" font-size="15" class="ink" font-weight="700">実在しない日付が混ざる</text>
  <text x="448" y="560" font-size="13" class="red" font-weight="700">契約違反で止める（2026-02-30）</text>
  <text x="448" y="584" font-size="12" class="sub">黙ったロールオーバーは起きない（ADR-43）</text>
  <rect x="800" y="508" width="340" height="92" rx="10" class="card"/>
  <text x="818" y="536" font-size="15" class="ink" font-weight="700">供給が来ない</text>
  <text x="818" y="560" font-size="13" class="red" font-weight="700">供給エラーで止める（機械可読な部分類）</text>
  <text x="818" y="584" font-size="12" class="sub">黙って祝日なしにしない。空の値とは型で区別</text>
  <text x="60" y="634" font-size="14" class="sub">答えには範囲外註釈と被覆サマリが併走する（評価 2026-01-01..2026-03-01・2 月以降は註釈つきで発火が続く）:</text>
  <text x="60" y="658" font-size="13" class="mono red">⚠ 範囲外 2026-02-01..2026-03-01（HRDB.holidays covering 2026-01-01..2026-01-31, asof 2026-01-15）</text>
  <text x="60" y="680" font-size="13" class="mono gold">被覆サマリ: HRDB.holidays covering 2026-01-01..2026-01-31 asof 2026-01-15 残走路 -28 日</text>
</svg>
