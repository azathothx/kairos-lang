<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 704" role="img" aria-labelledby="fig-external-socket-ja">
  <title id="fig-external-socket-ja">external の差し込み口の図。左は式（静的）で、premise HRDB に holidays = external(kind: dates) と宣言だけする。右は実行時に届くデータ（解決値）で、dates・covering 2026-01-01..2026-01-31・asof 2026-01-15 を運ぶ。中央の差し込み口には契約（covering と asof を必ず運ぶ）が書いてあり、下の 3 枚のカードは検査（covering の外の点と実在しない日付は契約違反、供給が来ないのは供給エラー）。最下行は答えに併走する範囲外註釈と被覆サマリ（残走路 -28 日）。</title>
