  <rect x="780" y="452" width="340" height="100" rx="10" class="card"/>
  <text x="796" y="472" font-size="14" class="ink" font-weight="700">Premise members (10 words)</text>
  <text x="796" y="494" font-size="12" class="mono sub">calendar-system:  calendar:  axis:</text>
  <text x="796" y="514" font-size="12" class="mono sub">roll:  granularity:  tz:  wkst:</text>
  <text x="796" y="534" font-size="12" class="mono sub">asof:  source:  epoch:</text>
  <text x="780" y="570" font-size="10.5" class="sub">Inherited along the base chain; only words declared in the block override</text>
  <text x="600" y="178" font-size="16" class="gold" text-anchor="middle" font-weight="700">derivation (with)</text>
  <line x1="444" y1="198" x2="744" y2="198" class="arrow"/><polygon points="756,198 742,191 742,205" class="arrowhead"/>
  <rect x="460" y="216" width="280" height="132" rx="10" class="card"/>
  <text x="474" y="242" font-size="12" class="mono ink">premise Fiscal = Gregorian with {</text>
  <text x="488.4" y="264" font-size="12" class="mono gold" font-weight="700">year = month span (_ =&gt; 12)</text>
  <text x="502.8" y="286" font-size="12" class="mono ink">phase: 3</text>
  <text x="502.8" y="308" font-size="12" class="mono ink">label: (p =&gt; yearNo(p))</text>
  <text x="474" y="330" font-size="12" class="mono ink">}</text>
  <text x="600" y="374" font-size="13" class="ink" text-anchor="middle" font-weight="700">Only year is replaced</text>
  <text x="600" y="396" font-size="11.5" class="sub" text-anchor="middle">month untouched → dates stay fixed (I1)</text>
  <text x="600" y="416" font-size="11.5" class="sub" text-anchor="middle">quarter, yearStart follow by re-resolution</text>
  <text x="600" y="456" font-size="12" class="sub" text-anchor="middle">everyday form (sugar):</text>
  <text x="600" y="476" font-size="11.5" class="mono gold" text-anchor="middle">Gregorian |&gt;</text>
  <text x="600" y="494" font-size="11.5" class="mono gold" text-anchor="middle">rephase(+3, on: year, unit: month)</text>
  <text x="60" y="612" font-size="12.5" class="sub">Only the named public words are replaced; the rest is inherited. Bare names re-resolve in the derived scope (mechanism A, ADR-17),</text>
  <text x="60" y="634" font-size="12.5" class="sub">so quarter and yearStart, which depend on year, follow automatically. Base.word pins a reference to the base's value.</text>
  <text x="60" y="656" font-size="12.5" class="sub">The 10 premise members are inherited along the base chain too; only the words declared in the block are overridden (ADR-35 rev. 3).</text>
  <text x="60" y="678" font-size="12.5" class="sub">Dates do not move (I1): a derivation moves only the window cuts. 2026-03-01 stays March 1; only its year window becomes fiscal 2025 (Apr 2025–Mar 2026).</text>
</svg>
