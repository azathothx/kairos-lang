  <title id="fig-premise-derivation-en">Deriving premise Fiscal from the base premise Gregorian with with. The left box holds Gregorian's public words (day, month, year, quarter, …) and the 10 premise members. The with block in the middle overrides only year to an April start; in the right box year is replaced, quarter and yearStart, which depend on year, follow by re-resolution, and the remaining public words and premise members are inherited from the base.</title>
