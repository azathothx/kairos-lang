  <rect width="1200" height="704" fill="#FBFAF8" class="bg"/>
  <text x="60" y="56" font-size="24" class="ink" font-weight="700">with replaces only the named public words and inherits the rest — deriving a fiscal calendar</text>
  <text x="60" y="90" font-size="13" class="sub">premise Fiscal = Gregorian with { year = … }. One override of year; quarter and yearStart, which depend on it, follow by re-resolution; month and day stay fixed</text>
  <rect x="60" y="120" width="380" height="460" rx="16" class="panel"/>
  <text x="80" y="156" font-size="19" class="ink" font-weight="700">Base premise: Gregorian</text>
  <text x="80" y="180" font-size="12" class="sub">Primitive definition — public words and premise members</text>
