  <text x="610" y="396" font-size="14" class="gold" font-weight="700">同じ日付＝rebase: 東京の 2/12 → NY の 2/12（ラベルの対応。14 時間のずれは見ない）</text>
  <text x="60" y="436" font-size="14" class="sub">積 &amp; は「同じ点」の演算。素朴に Tok.biz &amp; NYk.biz と書くと、東京の 2/12 の開始瞬間と NY の 2/12 の開始瞬間は等しくないので、答えは黙って空になる。</text>
  <text x="60" y="462" font-size="14" class="sub">言語はこの形を静的エラーで止め、snapTo（同じ瞬間）か rebase（同じ日付）かを書き手に選ばせる（§4.5 の整列・ADR-36／40）。</text>
