  <text x="60" y="56" font-size="30" class="ink" font-weight="700">東京の 2/12 と NY の 2/12 は同じ区間ではない——同じ瞬間と同じ日付</text>
  <text x="60" y="92" font-size="16" class="sub">一本の物理の時間軸に、東京（JST）とニューヨーク（EST）の市民日を置く。14 時間ずれた別々の区間になる</text>
